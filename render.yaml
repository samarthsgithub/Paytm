# Render Blueprint: Dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: payzip-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true       # random value generated once by Render
      - key: MONGO_URI
        sync: false               # paste your Atlas connection string in the dashboard
      - key: CORS_ORIGINS
        sync: false               # your Vercel URL, e.g. https://payzip.vercel.app
